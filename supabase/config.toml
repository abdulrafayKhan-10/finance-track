# Supabase CLI configuration. Used by `supabase link` / `supabase db push`
# and by the optional local stack (`supabase start`, needs Docker).
# Migrations live in supabase/migrations/ and are applied in filename order.
project_id = "finance-track"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
# Demo data is never loaded automatically; production must stay clean.
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
# Single-owner app: the owner account is created from the dashboard.
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
